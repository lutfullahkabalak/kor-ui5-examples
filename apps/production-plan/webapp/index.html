<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production plan</title>
  <link rel="stylesheet" href="app.css">
  <script>
    const language = new URLSearchParams(location.search).get("lang") === "tr" ? "tr" : "en";
    window["sap-ui-config"] = { language };
    document.documentElement.lang = language;
  </script>
  <script id="sap-ui-bootstrap"
    src="https://sdk.openui5.org/1.108.55/resources/sap-ui-core.js"
    data-sap-ui-async="true"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-resourceroots='{"kor.example.productionplan": "./", "kor.ui": "./resources/kor/ui/"}'
    data-sap-ui-onInit="module:sap/ui/core/ComponentSupport"></script>
</head>
<body class="kor">
  <div data-sap-ui-component data-name="kor.example.productionplan" data-id="app" data-height="100%" class="root"></div>
</body>
</html>
